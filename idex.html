<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="Cuadro_Registro">
            <h2>Formulario</h2>

            <form>
                <div class="fila">
                    <div class="input-grupo">
                    <label> Nombre Completo</label>
                    <input type=" text" placeholder="Ingresa tu Nombre">

                    </div>
                </div>
                <div class="input-grupo">
                    <label> usuario </label>
                    <input type=" text" placeholder="Ingresa tu Usuario">
                </div>

                <div class="input-grupo">
                    <label> Correo electronico</label>
                    <input type=" text" placeholder="Ingresa tu Correo">
                </div>

                <div class="input-grupo">
                    <label> Telefono </label>
                    <input type=" text" placeholder="Ingresa tu Telefono">
                </div>

                <div class="input-grupo">
                   <label> Contraseña </label>
                   <input type=" password" placeholder="Ingresa tu Contraseña">
                </div>

                <div class="input-grupo">
                  <label> Repite Contraseña </label>
                  <input type=" password" placeholder="Repite Contraseña">
                </div>

                <div class="grupo-input">
                <label>Género</label>
                <div class="opciones-genero">
                    <label><input type="radio" name="genero" checked> Masculino</label>
                    <label><input type="radio" name="genero"> Femenino</label>
                    <label><input type="radio" name="genero"> Prefiero no decirlo</label>
                </div>
            </div>

            <button type="submit" class="boton-enviar">Registrarse</button>
            </form>
        </div>
    </body>
</html>
